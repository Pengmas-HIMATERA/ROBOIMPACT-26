<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">INTEGRAL: pengaruh gain naik, turun, dan nol</title><desc id="desc">Tengah atas: Koreksi error menetap lebih kuat. Terlalu tinggi → bisa kebablasan. Tengah bawah: Pengaruh riwayat error berkurang. Error menetap lebih lama terkoreksi. Kanan: Tidak ada koreksi dari akumulasi error. P dan D tetap bekerja. Sketch saat ini: Ki = 0.</desc><rect width="1120" height="590" rx="18" fill="#f6f5ed"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="260" height="590" rx="18" fill="#243c33"/><rect x="245" width="15" height="590" fill="#243c33"/><text x="28" y="42" font-size="14" fill="#becdbd" font-weight="600">ROBOIMPACT / PID</text><text x="25" y="180" font-size="130" fill="#eceddf" font-weight="700">I</text><text x="28" y="227" font-size="20" fill="#eceddf" font-weight="700">INTEGRAL</text><text x="28" y="282" font-size="25" fill="#eceddf" font-weight="400">Atasi</text><text x="28" y="309" font-size="25" fill="#eceddf" font-weight="400">melenceng menetap</text><text x="28" y="384" font-size="18" fill="#bdcdbb" font-weight="400">Mengingat error yang</text><text x="28" y="411" font-size="18" fill="#bdcdbb" font-weight="400">terus bertahan.</text><text x="28" y="521" font-size="16" fill="#eceddf" font-weight="400">Ki × akumulasi error</text><rect x="282" y="22" width="443" height="245" rx="12" fill="#ffffff" stroke="#dce0d4"/><text x="305" y="60" font-size="20" fill="#3e7c65" font-weight="700">↑ DINAIKKAN</text><g transform="translate(320 79)"><path d="M0 45 H350" stroke="#9aa79b" stroke-width="3" stroke-dasharray="7 7"/><path d="M0 4 C80 4 110 8 155 48 S245 80 290 55 S325 40 350 45" fill="none" stroke="#3e7c65" stroke-width="5" stroke-linecap="round"/><path d="M346 37 l12 8 -12 8" fill="none" stroke="#9aa79b" stroke-width="2"/></g><text x="305" y="196" font-size="18" fill="#233d35" font-weight="400">Koreksi error menetap lebih kuat.</text><text x="305" y="223" font-size="18" fill="#233d35" font-weight="400">Terlalu tinggi → bisa kebablasan.</text><rect x="282" y="285" width="443" height="245" rx="12" fill="#ffffff" stroke="#dce0d4"/><text x="305" y="323" font-size="20" fill="#3e7c65" font-weight="700">↓ DITURUNKAN</text><g transform="translate(320 342)"><path d="M0 45 H350" stroke="#9aa79b" stroke-width="3" stroke-dasharray="7 7"/><path d="M0 4 C120 4 195 10 350 31" fill="none" stroke="#3e7c65" stroke-width="5" stroke-linecap="round"/><path d="M346 37 l12 8 -12 8" fill="none" stroke="#9aa79b" stroke-width="2"/></g><text x="305" y="459" font-size="18" fill="#233d35" font-weight="400">Pengaruh riwayat error berkurang.</text><text x="305" y="486" font-size="18" fill="#233d35" font-weight="400">Error menetap lebih lama terkoreksi.</text><rect x="747" y="22" width="351" height="508" rx="12" fill="#e8ecdf"/><text x="774" y="64" font-size="20" fill="#3e7c65" font-weight="700">0 / TIDAK DIPAKAI</text><text x="802" y="221" font-size="60" fill="#3e7c65" font-weight="700">I = 0</text><text x="774" y="299" font-size="19" fill="#233d35" font-weight="400">Tidak ada koreksi</text><text x="774" y="326" font-size="19" fill="#233d35" font-weight="400">dari akumulasi error.</text><text x="774" y="353" font-size="19" fill="#233d35" font-weight="400">P dan D tetap bekerja.</text><text x="774" y="380" font-size="19" fill="#233d35" font-weight="400">Sketch saat ini: Ki = 0.</text><text x="283" y="563" font-size="16" fill="#657368" font-weight="400">Garis putus = target · warna = ilustrasi respons, bukan data uji.</text></g></svg>