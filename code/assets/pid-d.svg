<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">DERIVATIF: pengaruh gain naik, turun, dan nol</title><desc id="desc">Tengah atas: Redaman bisa lebih kuat. Terlalu tinggi → sensitif noise. Tengah bawah: Lebih sedikit efek redaman. Bisa lebih mudah kebablasan. Kanan: Tidak merespons perubahan error. P dan I tetap bekerja. D saja: error tetap → D = 0.</desc><rect width="1120" height="590" rx="18" fill="#f6f5ed"/><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="260" height="590" rx="18" fill="#243c33"/><rect x="245" width="15" height="590" fill="#243c33"/><text x="28" y="42" font-size="14" fill="#becdbd" font-weight="600">ROBOIMPACT / PID</text><text x="25" y="180" font-size="130" fill="#eceddf" font-weight="700">D</text><text x="28" y="227" font-size="20" fill="#eceddf" font-weight="700">DERIVATIF</text><text x="28" y="282" font-size="25" fill="#eceddf" font-weight="400">Redam</text><text x="28" y="309" font-size="25" fill="#eceddf" font-weight="400">kebablasan</text><text x="28" y="384" font-size="18" fill="#bdcdbb" font-weight="400">Merespons perubahan</text><text x="28" y="411" font-size="18" fill="#bdcdbb" font-weight="400">error antar pembacaan.</text><text x="28" y="521" font-size="16" fill="#eceddf" font-weight="400">Kd × perubahan error</text><rect x="282" y="22" width="443" height="245" rx="12" fill="#ffffff" stroke="#dce0d4"/><text x="305" y="60" font-size="20" fill="#6166a0" font-weight="700">↑ DINAIKKAN</text><g transform="translate(320 79)"><path d="M0 45 H350" stroke="#9aa79b" stroke-width="3" stroke-dasharray="7 7"/><path d="M0 4 C90 4 100 47 170 45 L200 45 l8 -9 8 18 8 -16 8 12 8 -7 L350 45" fill="none" stroke="#6166a0" stroke-width="5" stroke-linecap="round"/><path d="M346 37 l12 8 -12 8" fill="none" stroke="#9aa79b" stroke-width="2"/></g><text x="305" y="196" font-size="18" fill="#233d35" font-weight="400">Redaman bisa lebih kuat.</text><text x="305" y="223" font-size="18" fill="#233d35" font-weight="400">Terlalu tinggi → sensitif noise.</text><rect x="282" y="285" width="443" height="245" rx="12" fill="#ffffff" stroke="#dce0d4"/><text x="305" y="323" font-size="20" fill="#6166a0" font-weight="700">↓ DITURUNKAN</text><g transform="translate(320 342)"><path d="M0 45 H350" stroke="#9aa79b" stroke-width="3" stroke-dasharray="7 7"/><path d="M0 4 C60 4 75 85 130 67 S190 16 230 34 S295 57 350 45" fill="none" stroke="#6166a0" stroke-width="5" stroke-linecap="round"/><path d="M346 37 l12 8 -12 8" fill="none" stroke="#9aa79b" stroke-width="2"/></g><text x="305" y="459" font-size="18" fill="#233d35" font-weight="400">Lebih sedikit efek redaman.</text><text x="305" y="486" font-size="18" fill="#233d35" font-weight="400">Bisa lebih mudah kebablasan.</text><rect x="747" y="22" width="351" height="508" rx="12" fill="#e8ecdf"/><text x="774" y="64" font-size="20" fill="#6166a0" font-weight="700">0 / TIDAK DIPAKAI</text><text x="802" y="221" font-size="60" fill="#6166a0" font-weight="700">D = 0</text><text x="774" y="299" font-size="19" fill="#233d35" font-weight="400">Tidak merespons</text><text x="774" y="326" font-size="19" fill="#233d35" font-weight="400">perubahan error.</text><text x="774" y="353" font-size="19" fill="#233d35" font-weight="400">P dan I tetap bekerja.</text><text x="774" y="380" font-size="19" fill="#233d35" font-weight="400">D saja: error tetap → D = 0.</text><text x="283" y="563" font-size="16" fill="#657368" font-weight="400">Garis putus = target · warna = ilustrasi respons, bukan data uji.</text></g></svg>